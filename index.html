<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --glass-bg: rgba(255,255,255,0.02);
  --glass-border: rgba(255,255,255,0.07);
  --glass-border-hover: rgba(255,255,255,0.2);
  --accent: #fff;
  --muted: rgba(255,255,255,0.35);
}

html, body {
  width: 100%; min-height: 100vh;
  overflow: hidden;
  background: #000;
  font-family: 'Inter', system-ui, sans-serif;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: crosshair;
}

/* ===== CANVAS LAYERS ===== */
#starfield, #matrix, #fireworks, #particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
#starfield { z-index: 0; }
#matrix { z-index: 1; opacity: 0.15; }
#fireworks { z-index: 2; }
#particles { z-index: 3; }

/* ===== NOISE ===== */
.noise {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  animation: noiseShift 0.5s steps(4) infinite;
}
@keyframes noiseShift {
  0% { transform: translate(0,0); }
  25% { transform: translate(-5px,5px); }
  50% { transform: translate(5px,-5px); }
  75% { transform: translate(-3px,-3px); }
  100% { transform: translate(0,0); }
}

/* ===== CRT SCANLINES ===== */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.02) 2px,
    rgba(255,255,255,0.02) 4px
  );
  animation: scanlineMove 8s linear infinite;
}
@keyframes scanlineMove {
  0% { background-position: 0 0; }
  100% { background-position: 0 100vh; }
}

/* ===== VIGNETTE ===== */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.8) 100%);
  animation: vignettePulse 6s ease-in-out infinite;
}
@keyframes vignettePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

/* ===== GLITCH FLASH ===== */
.glitch-flash {
  position: fixed;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  background: rgba(255,255,255,0.03);
  opacity: 0;
}

/* ===== CURSOR GLOW + TRAIL ===== */
.cursor-glow {
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 8;
  transition: left 0.08s ease-out, top 0.08s ease-out;
  mix-blend-mode: screen;
}

/* ===== MAIN CONTAINER ===== */
.container {
  position: relative;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 40px 20px;
  max-width: 540px;
  width: 100%;
  animation: containerIn 1.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  opacity: 0;
  transform: translateY(60px) scale(0.9);
}
@keyframes containerIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== LIQUID GLASS CARD ===== */
.glass-card {
  position: relative;
  width: 100%;
  padding: 56px 44px 48px;
  border-radius: 36px;
  background: 
    linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.01) 40%, rgba(255,255,255,0.04) 100%);
  backdrop-filter: blur(80px) saturate(220%);
  -webkit-backdrop-filter: blur(80px) saturate(220%);
  border: 1px solid var(--glass-border);
  box-shadow: 
    0 0 0 1px rgba(255,255,255,0.015),
    0 24px 80px rgba(0,0,0,0.6),
    0 0 100px rgba(255,255,255,0.025),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(255,255,255,0.03);
  overflow: hidden;
  animation: glassFloat 5s ease-in-out infinite, glassTilt 8s ease-in-out infinite;
  transform-style: preserve-3d;
}
@keyframes glassFloat {
  0%, 100% { transform: translateY(0) rotateX(0deg); }
  50% { transform: translateY(-8px) rotateX(1deg); }
}
@keyframes glassTilt {
  0%, 100% { transform: rotateY(0deg); }
  50% { transform: rotateY(0.5deg); }
}

/* Liquid shine sweep */
.glass-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 36px;
  background: linear-gradient(
    110deg,
    transparent 25%,
    rgba(255,255,255,0.1) 42%,
    rgba(255,255,255,0.2) 50%,
    rgba(255,255,255,0.1) 58%,
    transparent 75%
  );
  background-size: 300% 100%;
  animation: shineSweep 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shineSweep {
  0% { background-position: 300% 0; }
  100% { background-position: -300% 0; }
}

/* Inner ring glow */
.glass-card::after {
  content: '';
  position: absolute;
  inset: 2px;
  border-radius: 34px;
  border: 1px solid rgba(255,255,255,0.03);
  pointer-events: none;
}

/* ===== GLITCH BRAND ===== */
.brand {
  text-align: center;
  margin-bottom: 40px;
  position: relative;
}
.brand h1 {
  font-size: 52px;
  font-weight: 900;
  letter-spacing: -2px;
  background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 60px rgba(255,255,255,0.15);
  position: relative;
  animation: brandPulse 3s ease-in-out infinite;
}
@keyframes brandPulse {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(255,255,255,0.1)); }
  50% { filter: brightness(1.2) drop-shadow(0 0 40px rgba(255,255,255,0.2)); }
}

/* Glitch layers */
.brand h1::before, .brand h1::after {
  content: 'Zuzify';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
}
.brand h1.glitch::before {
  animation: glitch1 0.3s ease-out;
  left: 3px;
  opacity: 0.8;
  clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
}
.brand h1.glitch::after {
  animation: glitch2 0.3s ease-out;
  left: -3px;
  opacity: 0.8;
  clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
}
@keyframes glitch1 {
  0% { transform: translate(0); }
  20% { transform: translate(-5px, 2px); }
  40% { transform: translate(5px, -2px); }
  60% { transform: translate(-3px, 1px); }
  80% { transform: translate(3px, -1px); }
  100% { transform: translate(0); opacity: 0; }
}
@keyframes glitch2 {
  0% { transform: translate(0); }
  20% { transform: translate(5px, -2px); }
  40% { transform: translate(-5px, 2px); }
  60% { transform: translate(3px, -1px); }
  80% { transform: translate(-3px, 1px); }
  100% { transform: translate(0); opacity: 0; }
}

.brand p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 500;
  animation: fadeIn 2s ease 0.5s forwards;
  opacity: 0;
}

/* ===== DOWNLOAD BUTTON ===== */
.download-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 4px;
}
.download-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 22px 68px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: lowercase;
  color: #fff;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  cursor: pointer;
  text-decoration: none;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  overflow: hidden;
  box-shadow: 
    0 6px 30px rgba(0,0,0,0.4),
    0 0 0 1px rgba(255,255,255,0.02),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
.download-btn svg {
  width: 22px; height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}
.download-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 55%);
  opacity: 0;
  transition: opacity 0.5s;
}
.download-btn::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 23px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent, rgba(255,255,255,0.15));
  opacity: 0;
  z-index: -1;
  filter: blur(12px);
  transition: opacity 0.5s;
}
.download-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--glass-border-hover);
  transform: translateY(-5px) scale(1.04);
  box-shadow: 
    0 16px 60px rgba(0,0,0,0.5),
    0 0 50px rgba(255,255,255,0.08),
    inset 0 1px 0 rgba(255,255,255,0.2);
}
.download-btn:hover svg { transform: translateY(3px); }
.download-btn:hover::before { opacity: 1; }
.download-btn:hover::after { opacity: 1; }
.download-btn:active {
  transform: translateY(-2px) scale(0.97);
  transition: all 0.1s;
}

/* Ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: scale(0);
  animation: rippleAnim 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(6); opacity: 0; }
}

/* ===== UPDATE LOG ===== */
.log-card {
  width: 100%;
  border-radius: 28px;
  background: rgba(255,255,255,0.012);
  backdrop-filter: blur(50px) saturate(200%);
  -webkit-backdrop-filter: blur(50px) saturate(200%);
  border: 1px solid var(--glass-border);
  box-shadow: 
    0 10px 40px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.06);
  overflow: hidden;
  animation: logIn 1.2s cubic-bezier(0.23, 1, 0.32, 1) 0.4s forwards;
  opacity: 0;
  transform: translateY(30px);
}
@keyframes logIn {
  to { opacity: 1; transform: translateY(0); }
}

.log-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 26px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.log-header svg {
  width: 16px; height: 16px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.log-header span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}

.log-body {
  padding: 22px 26px 26px;
  max-height: 180px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.9;
  color: rgba(255,255,255,0.55);
  white-space: pre-wrap;
}
.log-body::-webkit-scrollbar { width: 3px; }
.log-body::-webkit-scrollbar-track { background: transparent; }
.log-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
.log-body strong, .log-body b { color: #fff; font-weight: 600; }

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  font-size: 10px;
  color: rgba(255,255,255,0.15);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: footerIn 1.5s ease 0.8s forwards;
  opacity: 0;
}
@keyframes footerIn { to { opacity: 1; } }

/* ===== RESPONSIVE ===== */
@media (max-width: 580px) {
  .glass-card { padding: 40px 24px 36px; border-radius: 28px; }
  .brand h1 { font-size: 40px; }
  .download-btn { padding: 18px 48px; font-size: 16px; }
  .log-body { max-height: 140px; }
}
</style>

<body>

<canvas id="starfield"></canvas>
<canvas id="matrix"></canvas>
<canvas id="fireworks"></canvas>
<canvas id="particles"></canvas>

<div class="noise"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="glitch-flash" id="glitchFlash"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="container">
  <div class="glass-card" id="glassCard">
    <div class="brand">
      <h1 id="brandTitle">Zuzify</h1>
      <p>Installer</p>
    </div>
    <div class="download-wrap">
      <a href="https://github.com/taithedev/ZuzifyInstaller-/releases/download/download/ZuzifyInstaller.exe"
         class="download-btn"
         id="downloadBtn"
         download>
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        download
      </a>
    </div>
  </div>

  <div class="log-card">
    <div class="log-header">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Update Log</span>
    </div>
    <div class="log-body" id="logBody">     V2<br>mew user interface<br>SUABP instead of BAGCOD ( faster loading )<br>Discord API Implemented</div>
  </div>

  <div class="footer">zuzify &mdash; built by taithedev</div>
</div>

<script>
// ===== STARFIELD =====
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let SW, SH, stars = [];

function resizeStar() {
  SW = starCanvas.width = window.innerWidth;
  SH = starCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeStar);
resizeStar();

class Star {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = (Math.random() - 0.5) * SW * 2;
    this.y = (Math.random() - 0.5) * SH * 2;
    this.z = Math.random() * SW;
    this.pz = this.z;
  }
  update() {
    this.z -= 2;
    if (this.z <= 0) this.reset();
  }
  draw() {
    const sx = (this.x / this.z) * SW/2 + SW/2;
    const sy = (this.y / this.z) * SH/2 + SH/2;
    const r = (1 - this.z / SW) * 2.5;
    const px = (this.x / this.pz) * SW/2 + SW/2;
    const py = (this.y / this.pz) * SH/2 + SH/2;
    this.pz = this.z;
    if (sx < 0 || sx > SW || sy < 0 || sy > SH) return;
    starCtx.beginPath();
    starCtx.moveTo(px, py);
    starCtx.lineTo(sx, sy);
    starCtx.strokeStyle = `rgba(255,255,255,${(1 - this.z/SW) * 0.6})`;
    starCtx.lineWidth = r * 0.5;
    starCtx.stroke();
    starCtx.beginPath();
    starCtx.arc(sx, sy, r, 0, Math.PI*2);
    starCtx.fillStyle = `rgba(255,255,255,${(1 - this.z/SW) * 0.8})`;
    starCtx.fill();
  }
}
for (let i = 0; i < 300; i++) stars.push(new Star());

function animateStars() {
  starCtx.fillStyle = 'rgba(0,0,0,0.2)';
  starCtx.fillRect(0, 0, SW, SH);
  stars.forEach(s => { s.update(); s.draw(); });
  requestAnimationFrame(animateStars);
}
animateStars();

// ===== MATRIX RAIN =====
const matCanvas = document.getElementById('matrix');
const matCtx = matCanvas.getContext('2d');
let MW, MH, matDrops = [];
const matChars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';

function resizeMat() {
  MW = matCanvas.width = window.innerWidth;
  MH = matCanvas.height = window.innerHeight;
  matDrops = [];
  const cols = Math.floor(MW / 14);
  for (let i = 0; i < cols; i++) matDrops[i] = Math.random() * -100;
}
window.addEventListener('resize', resizeMat);
resizeMat();

function animateMatrix() {
  matCtx.fillStyle = 'rgba(0,0,0,0.05)';
  matCtx.fillRect(0, 0, MW, MH);
  matCtx.fillStyle = 'rgba(255,255,255,0.08)';
  matCtx.font = '13px monospace';
  for (let i = 0; i < matDrops.length; i++) {
    const char = matChars[Math.floor(Math.random() * matChars.length)];
    matCtx.fillText(char, i * 14, matDrops[i] * 14);
    if (matDrops[i] * 14 > MH && Math.random() > 0.975) matDrops[i] = 0;
    matDrops[i]++;
  }
  requestAnimationFrame(animateMatrix);
}
animateMatrix();

// ===== FIREWORKS =====
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');
let FW, FH, fireworks = [], particles2 = [];

function resizeFW() {
  FW = fwCanvas.width = window.innerWidth;
  FH = fwCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeFW);
resizeFW();

class Firework {
  constructor(x, y, targetY) {
    this.x = x;
    this.y = y;
    this.targetY = targetY;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = -Math.random() * 3 - 10;
    this.hue = Math.random() * 360;
    this.dead = false;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.15;
    if (this.vy >= 0 || this.y <= this.targetY) {
      this.dead = true;
      explode(this.x, this.y);
    }
  }
  draw() {
    fwCtx.beginPath();
    fwCtx.arc(this.x, this.y, 2, 0, Math.PI*2);
    fwCtx.fillStyle = '#fff';
    fwCtx.fill();
  }
}

class Particle2 {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = Math.random() * 0.015 + 0.01;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08;
    this.vx *= 0.98;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    fwCtx.beginPath();
    fwCtx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    fwCtx.fillStyle = `rgba(255,255,255,${this.life})`;
    fwCtx.fill();
  }
}

function explode(x, y) {
  for (let i = 0; i < 60; i++) {
    particles2.push(new Particle2(x, y));
  }
}

function animateFW() {
  fwCtx.clearRect(0, 0, FW, FH);
  fwCtx.globalCompositeOperation = 'lighter';

  fireworks = fireworks.filter(f => !f.dead);
  fireworks.forEach(f => { f.update(); f.draw(); });

  particles2 = particles2.filter(p => p.life > 0);
  particles2.forEach(p => { p.update(); p.draw(); });

  fwCtx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(animateFW);
}
animateFW();

// Auto fireworks
setInterval(() => {
  if (Math.random() > 0.6) {
    fireworks.push(new Firework(Math.random() * FW, FH, Math.random() * FH * 0.5));
  }
}, 2000);

// ===== PARTICLE NETWORK =====
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let PW, PH, netParticles = [];

function resizeP() {
  PW = pCanvas.width = window.innerWidth;
  PH = pCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeP);
resizeP();

class NetParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * PW;
    this.y = Math.random() * PH;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.radius = Math.random() * 2 + 0.5;
    this.alpha = Math.random() * 0.3 + 0.1;
    this.pulse = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.pulse += 0.02;
    const dx = this.x - mouseX;
    const dy = this.y - mouseY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 180) {
      const force = (180 - dist) / 180;
      this.vx += (dx / dist) * force * 0.4;
      this.vy += (dy / dist) * force * 0.4;
    }
    this.vx *= 0.98;
    this.vy *= 0.98;
    if (this.x < 0 || this.x > PW || this.y < 0 || this.y > PH) this.reset();
  }
  draw() {
    const a = this.alpha * (0.6 + 0.4 * Math.sin(this.pulse));
    pCtx.beginPath();
    pCtx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    pCtx.fillStyle = `rgba(255,255,255,${a})`;
    pCtx.fill();
  }
}
for (let i = 0; i < 100; i++) netParticles.push(new NetParticle());

function drawNetLines() {
  for (let i = 0; i < netParticles.length; i++) {
    for (let j = i + 1; j < netParticles.length; j++) {
      const dx = netParticles[i].x - netParticles[j].x;
      const dy = netParticles[i].y - netParticles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 140) {
        const alpha = (1 - dist / 140) * 0.06;
        pCtx.beginPath();
        pCtx.moveTo(netParticles[i].x, netParticles[i].y);
        pCtx.lineTo(netParticles[j].x, netParticles[j].y);
        pCtx.strokeStyle = `rgba(255,255,255,${alpha})`;
        pCtx.lineWidth = 0.5;
        pCtx.stroke();
      }
    }
  }
}

function animateNet() {
  pCtx.clearRect(0, 0, PW, PH);
  netParticles.forEach(p => { p.update(); p.draw(); });
  drawNetLines();
  requestAnimationFrame(animateNet);
}
animateNet();

// ===== RIPPLE =====
const downloadBtn = document.getElementById('downloadBtn');
downloadBtn.addEventListener('click', function(e) {
  const rect = this.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height) * 2;
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  this.appendChild(ripple);
  setTimeout(() => ripple.remove(), 1000);

  // Confetti burst from button
  for (let i = 0; i < 30; i++) {
    particles2.push(new Particle2(e.clientX, e.clientY));
  }
});
