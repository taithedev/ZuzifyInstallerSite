<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuzify</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

/* Animated mesh gradient background */
.bg {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(255,255,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 60%);
  animation: bgShift 12s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
  100% { transform: scale(1.15) rotate(3deg); filter: hue-rotate(10deg); }
}

/* Floating orbs */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  animation: floatOrb 15s ease-in-out infinite;
}
.orb:nth-child(1) { width: 400px; height: 400px; background: #fff; top: -10%; left: -10%; animation-delay: 0s; }
.orb:nth-child(2) { width: 300px; height: 300px; background: #ccc; bottom: -5%; right: -5%; animation-delay: -5s; }
.orb:nth-child(3) { width: 250px; height: 250px; background: #eee; top: 40%; left: 60%; animation-delay: -10s; }
@keyframes floatOrb {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(60px, -40px) scale(1.1); }
  66% { transform: translate(-40px, 60px) scale(0.9); }
}

/* Noise texture overlay */
.noise {
  position: fixed;
  inset: 0;
  opacity: 0.04;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* Liquid glass card */
.glass {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 60px 80px;
  border-radius: 32px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 -1px 0 rgba(255,255,255,0.05);
  animation: glassPulse 4s ease-in-out infinite;
}
@keyframes glassPulse {
  0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(255,255,255,0.05); }
  50% { box-shadow: 0 12px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(255,255,255,0.08), 0 0 60px rgba(255,255,255,0.03); }
}

/* Liquid shine effect on glass */
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 32px;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.05) 100%);
  pointer-events: none;
  animation: shineMove 6s ease-in-out infinite;
}
@keyframes shineMove {
  0%, 100% { opacity: 0.5; transform: translateX(-10%); }
  50% { opacity: 0.8; transform: translateX(10%); }
}

/* Download button */
.download-btn {
  position: relative;
  display: inline-block;
  padding: 18px 56px;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: lowercase;
  color: #fff;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  cursor: pointer;
  text-decoration: none;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.download-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
  opacity: 0;
  transition: opacity 0.4s;
}
.download-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.25);
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,255,255,0.05);
}
.download-btn:hover::before { opacity: 1; }
.download-btn:active {
  transform: translateY(-1px) scale(0.98);
}

/* Ripple effect container */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: scale(0);
  animation: rippleAnim 0.8s linear;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

/* Cursor glow trail */
.cursor-glow {
  position: fixed;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: left 0.15s ease-out, top 0.15s ease-out;
  z-index: 1;
}

/* Scanlines */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.015) 2px,
    rgba(255,255,255,0.015) 4px
  );
  z-index: 2;
}

/* Vignette */
.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  z-index: 3;
}
</style>
<base target="_blank">
</head>
<body>

<div class="bg"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="noise"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="glass">
  <a href="https://github.com/taithedev/ZuzifyInstaller-/releases/download/download/ZuzifyInstaller.exe" 
     class="download-btn" 
     id="downloadBtn"
     download>
    download
  </a>
</div>

<script>
// Cursor glow follow
const cursorGlow = document.getElementById('cursorGlow');
document.addEventListener('mousemove', (e) => {
  cursorGlow.style.left = e.clientX + 'px';
  cursorGlow.style.top = e.clientY + 'px';
});

// Ripple effect on button click
document.getElementById('downloadBtn').addEventListener('click', function(e) {
  const btn = this;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 800);
});

// Subtle parallax on mouse move
document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 20;
  document.querySelector('.glass').style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
});

// Random micro-movements for orbs
setInterval(() => {
  document.querySelectorAll('.orb').forEach((orb, i) => {
    const rx = (Math.random() - 0.5) * 30;
    const ry = (Math.random() - 0.5) * 30;
    orb.style.transform = `translate(${rx}px, ${ry}px)`;
  });
}, 3000);
</script>

</body>
</html>
